  </pattern>
  <filter id="sg" x="-60%" y="-120%" width="220%" height="340%">
    <feGaussianBlur stdDeviation="1.7" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
  </filter>
  <filter id="sgs" x="-60%" y="-60%" width="220%" height="220%">
