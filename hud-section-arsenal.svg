<style>
  .sttl{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:23px;font-weight:700;letter-spacing:6px}
  .ssub{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:12px;letter-spacing:2.2px}
  .ssts{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:12px;font-weight:700;letter-spacing:2px}
  .spn{animation:sp 14s linear infinite}
  .spnr{animation:spr 9s linear infinite}
  .ssw{animation:sp 4.4s linear infinite}
  .blk{animation:bl 1.5s steps(1) infinite}
  .pls{animation:pl 2.6s ease-in-out infinite alternate}
  .trav{animation:tv 5.4s cubic-bezier(.5,0,.5,1) infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @keyframes spr{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  @keyframes bl{0%,55%{opacity:1}56%,100%{opacity:.18}}
  @keyframes pl{0%{opacity:.5}100%{opacity:1}}
  @keyframes tv{0%{transform:translateX(-200px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
</style>
