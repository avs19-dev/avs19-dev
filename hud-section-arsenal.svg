  </linearGradient>
  <linearGradient id="sline" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#4DA6FF" stop-opacity="0" /><stop offset="14%" stop-color="#4DA6FF" stop-opacity=".85" />
    <stop offset="86%" stop-color="#4DA6FF" stop-opacity=".85" /><stop offset="100%" stop-color="#4DA6FF" stop-opacity="0" />
