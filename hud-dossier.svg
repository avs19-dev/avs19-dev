  <linearGradient id="shimG" x1="0%" x2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" /><stop offset="50%" stop-color="#FFFFFF" stop-opacity=".55" />
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
  </linearGradient>
  <filter id="pg" x="-60%" y="-100%" width="220%" height="300%">
    <feGaussianBlur stdDeviation="1.6" result="b" />
    <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
  </filter>
  <filter id="pgs" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="0.9" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
  </filter>
  <clipPath id="rowClip"><rect x="270" y="96" width="890" height="196" /></clipPath>
</defs>
<style>
  .phdr{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:22px;font-weight:700;letter-spacing:6px}
  .plbl{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:13px;font-weight:700;letter-spacing:1.8px}
  .pval{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:14px;letter-spacing:.4px}
  .pbody{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:13px;letter-spacing:.3px}
  .ptiny{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:11.5px;letter-spacing:1.2px}
  .ptiny.b{font-weight:700}
  .pmid{font-family:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;font-size:17px;font-weight:700;letter-spacing:4.4px}
  .dspin{animation:ds 12s linear infinite}
  .dspinr{animation:dsr 8s linear infinite}
  .blinkd{animation:bd 1.5s steps(1) infinite}
  .bar{animation:bp 3.2s ease-in-out infinite alternate}
  .rev{animation:rv 9s ease-out infinite backwards}
  .dsweep{animation:dsw 7s linear infinite}
  @keyframes ds{to{transform:rotate(360deg)}}
  @keyframes dsr{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
  @keyframes bd{0%,55%{opacity:1}56%,100%{opacity:.15}}
  @keyframes bp{0%{opacity:.5}100%{opacity:1}}
  @keyframes rv{0%{opacity:.42}18%,88%{opacity:1}100%{opacity:.42}}
  @keyframes dsw{0%{transform:translateX(0);opacity:0}8%{opacity:.75}92%{opacity:.75}100%{transform:translateX(880px);opacity:0}}
</style>
