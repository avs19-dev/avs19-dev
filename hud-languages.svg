<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Most Used Languages</title>
  <desc id="desc">Primary language stack: Python, Rust, C, Bash and SQL.</desc>
  <rect width="600" height="320" rx="10" fill="#02070F" stroke="#00E5FF" stroke-width="2"/>
  <rect x="1" y="1" width="598" height="318" rx="9" fill="none" stroke="#0A2A4A"/>
  <text x="28" y="48" fill="#00E5FF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Most Used Languages</text>
  <text x="28" y="76" fill="#9FDCFF" font-family="Arial, sans-serif" font-size="13">PRIMARY STACK // LANGUAGE TELEMETRY</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#D8F5FF">
    <text x="28" y="120">Python</text><text x="530" y="120" text-anchor="end" fill="#9FDCFF">40%</text>
    <text x="28" y="160">Rust</text><text x="530" y="160" text-anchor="end" fill="#9FDCFF">25%</text>
    <text x="28" y="200">C</text><text x="530" y="200" text-anchor="end" fill="#9FDCFF">15%</text>
    <text x="28" y="240">Bash</text><text x="530" y="240" text-anchor="end" fill="#9FDCFF">10%</text>
    <text x="28" y="280">SQL</text><text x="530" y="280" text-anchor="end" fill="#9FDCFF">10%</text>
  </g>
  <g fill="#0A2A4A">
    <rect x="115" y="108" width="390" height="10" rx="5"/><rect x="115" y="148" width="390" height="10" rx="5"/>
    <rect x="115" y="188" width="390" height="10" rx="5"/><rect x="115" y="228" width="390" height="10" rx="5"/>
    <rect x="115" y="268" width="390" height="10" rx="5"/>
  </g>
  <g fill="#00E5FF">
    <rect x="115" y="108" width="156" height="10" rx="5"/><rect x="115" y="148" width="98" height="10" rx="5"/>
    <rect x="115" y="188" width="59" height="10" rx="5"/><rect x="115" y="228" width="39" height="10" rx="5"/>
    <rect x="115" y="268" width="39" height="10" rx="5"/>
  </g>
